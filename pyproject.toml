[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scan"
version = "0.0.1"
description = "Security scanner for AI and agentic AI applications: honest verdicts, offline knowledge base."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-scan = "agent_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_scan = ["data/kb/*.json"]
