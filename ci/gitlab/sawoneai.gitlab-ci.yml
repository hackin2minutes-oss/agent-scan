# SawoneAI for GitLab CI. Copy this job into your .gitlab-ci.yml, or include this file.
# The image is the SawoneAI container. Set SAWONEAI_IMAGE to your registry copy, pinned by digest.
# The job needs no network access to scan, and it writes SARIF as an artifact.

sawoneai:
  stage: test
  image:
    name: "${SAWONEAI_IMAGE:-sawoneai:0.0.1}"
    entrypoint: [""]
  variables:
    GIT_DEPTH: "1"
  script:
    - sawoneai scan . --format sarif --output sawoneai.sarif
  artifacts:
    when: always
    paths:
      - sawoneai.sarif
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
